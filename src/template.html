<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP-todo-list</title>
</head>
<body>
    <aside class="sidebar">
        <button class="btn-add-project">Add project</button>
        <h3>PROJECTS</h3>
        <section class="container-projects"></section>
        <dialog class="dialog-project">
            <form class="form-project">
                <div>
                    <label for="project-title">Project title:</label><br>
                    <input type="text" id="project-title" required>
                </div>
                <div>
                    <button class="btn-accept-project" type="submit">Accept</button>
                    <button class="btn-cancel-project" type="button">Cancel</button>
                </div>
            </form>
        </dialog>
    </aside>

    <main class="main-content">
        <header class="header">
            <h2 class="name-project">Default</h2>
            <button class="btn-add-task">Add task</button>
        </header>
        <section class="container-tasks"></section>
        <dialog class="dialog-task">
            <form class="form-task">
                <div>
                    <label for="todo-title">Todo title:</label><br>
                    <input type="text" id="todo-title" required>
                </div>
                <div>
                    <label for="todo-priority">Todo priority:</label><br>
                    <select id="todo-priority">
                        <option value="high" selected>High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div>
                    <label for="todo-duedate">Todo duedate:</label><br>
                    <input type="date" id="todo-duedate" required>
                </div>
                <div>
                    <button class="btn-accept-task" type="submit">Accept</button>
                    <button class="btn-cancel-task" type="button">Cancel</button>
                </div>
            </form>
        </dialog>
    </main>
</body>
</html>
